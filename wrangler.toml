name = "ocr-scan-component"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# Serve the embeddable widget and demo page as static assets
[assets]
directory = "./public"
binding = "ASSETS"

# Workers AI binding for vision OCR (Moondream / Llama vision)
[ai]
binding = "AI"

[vars]
# Comma-separated origins allowed to call the API from browsers.
# Use * for open embed use, or lock this down in production.
ALLOWED_ORIGINS = "*"
# Optional shared secret. When set, clients must send header: X-OCR-Key: <value>
# API_KEY = ""
